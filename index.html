<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="A daily drum kit and pattern. Oscillator, acoustic, and modern electronic kits.">
<title>Daily Earshot</title>
<style>
  :root {
    --bg: #10100e;
    --fg: #ebe6dc;
    --muted: #a39e93;
    --dim: #6f6a62;
    --line: #3a3832;
    --cell: #221f1b;
    --beat: #2c2923;
    --accent: #e0a36a;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0.85rem 0.7rem 2.75rem;
  }
  .mast {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin: 0 0 1.6rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid #2a2823;
  }
  .kicker, .date {
    margin: 0;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.5rem, 7vw, 3.6rem);
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin: 0 0 0.85rem;
  }
  .lede {
    font-family: var(--serif);
    font-size: 1.08rem;
    line-height: 1.45;
    color: #ddd6c8;
    max-width: none;
    margin: 0 0 0.85rem;
  }
  .transport {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.7rem 1.15rem;
    margin: 0 0 1.15rem;
  }
  button {
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    min-height: 44px;
    padding: 0.45rem 1.05rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  button[aria-pressed="true"] {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  #play {
    background: var(--accent);
    color: #1a120c;
    border-color: var(--accent);
    font-weight: 600;
    min-width: 5.5rem;
  }
  #play:hover { color: #1a120c; background: #ebc08a; border-color: #ebc08a; }
  #play[aria-pressed="true"] {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }
  .tempo {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--muted);
    font-size: 0.88rem;
    flex: 1 1 12rem;
    max-width: 24rem;
  }
  .tempo input { width: auto; flex: 1; min-width: 6rem; accent-color: var(--accent); }
  .tempo b { color: var(--fg); font-weight: 500; min-width: 2.2rem; }
  .readout {
    margin: 0;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .readout strong { color: var(--fg); font-weight: 500; }
  .note {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0.85rem 0 1.1rem;
    max-width: none;
  }
  .ticks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    width: 100%;
    margin: 0 0 0.85rem;
  }
  button.tick {
    flex: 1 1 1.35rem;
    min-width: 1.35rem;
    width: auto;
    height: 1.15rem;
    min-height: 1.15rem;
    padding: 0;
    border: 0;
    border-radius: 2px;
    background: #34302a;
  }
  button.tick:hover { background: #6a6256; color: inherit; }
  button.tick.now { background: var(--accent); }
  .score { user-select: none; min-width: 0; }
  .ruler, .lane {
    display: grid;
    grid-template-columns: 4.4rem repeat(16, minmax(0, 1fr));
    gap: 3px;
    align-items: center;
    min-width: 0;
  }
  .ruler {
    color: var(--dim);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
  }
  .ruler span { text-align: center; }
  .lane { margin-bottom: 0.28rem; }
  .name {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name.hot { color: var(--fg); }
  .cell {
    height: 0.85rem;
    border-radius: 1px;
    background: var(--cell);
    cursor: pointer;
  }
  .cell:hover { box-shadow: inset 0 0 0 1px #6a6256; }
  .cell.beat { background: var(--beat); }
  .cell.on { background: var(--accent); }
  .cell.head { box-shadow: inset 0 0 0 1px #5c5348; }
  .mast-left { display: flex; align-items: center; gap: 0.75rem; }
  #panel-toggle { min-height: 36px; padding: 0.3rem 0.85rem; }
  body.panel-open #panel-toggle { display: none; }
  #kit-panel {
    position: fixed;
    z-index: 6;
    top: 0;
    left: 0;
    bottom: 0;
    width: 300px;
    overflow: auto;
    background: #161410;
    border-right: 1px solid var(--line);
    padding: 0.85rem 0.9rem 2rem;
  }
  #kit-panel[hidden] { display: none; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin: 0 0 0.9rem;
  }
  #kit-panel h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: 1.45rem;
    font-weight: 500;
  }
  #panel-close { min-height: 36px; padding: 0.3rem 0.75rem; }
  .modes, .families, .panel-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin: 0 0 0.85rem;
  }
  .modes button, .families button, .panel-actions button {
    min-height: 36px;
    padding: 0.3rem 0.7rem;
    font-size: 0.82rem;
  }
  .voice-edit { border-top: 1px solid #2a2823; padding: 0.55rem 0 0.35rem; }
  .voice-edit h3 { margin: 0 0 0.25rem; font-size: 0.84rem; font-weight: 500; }
  .knob {
    display: grid;
    grid-template-columns: 3.1rem 1fr;
    align-items: center;
    gap: 0.35rem;
    color: var(--muted);
    font-size: 0.72rem;
    margin: 0.12rem 0;
  }
  .knob input { width: 100%; accent-color: var(--accent); }
  .status { color: var(--muted); font-size: 0.85rem; margin: 0 0 0.85rem; }
  .status:empty { display: none; }
  @media (min-width: 860px) {
    body.panel-open main {
      margin-left: 300px;
      width: calc(100% - 300px);
    }
  }
  @media (max-width: 859px) {
    #kit-panel { width: min(22rem, 92vw); box-shadow: 12px 0 32px rgba(0, 0, 0, 0.45); }
  }
  @media (max-width: 640px) {
    main { padding: 0.65rem 0.5rem 2rem; }
    .tempo { max-width: none; }
    .mast { flex-direction: column; gap: 0.35rem; }
    .ruler, .lane {
      grid-template-columns: 3.35rem repeat(16, minmax(0, 1fr));
      gap: 2px;
    }
    .name { font-size: 0.68rem; }
    .cell { height: 0.62rem; }
    .tempo { width: 100%; }
    .tempo input { flex: 1; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<aside id="kit-panel" aria-label="Kit" hidden>
  <div class="panel-head">
    <h2>Kit</h2>
    <button type="button" id="panel-close">Close</button>
  </div>
  <div class="modes" role="group" aria-label="Sound">
    <button type="button" data-mode="osc" aria-pressed="true">Oscillator</button>
    <button type="button" data-mode="acoustic" aria-pressed="false">Acoustic</button>
    <button type="button" data-mode="modern" aria-pressed="false">Modern electronic</button>
  </div>
  <div class="families" id="families" role="group" aria-label="Oscillator kit"></div>
  <div id="voices"></div>
  <div class="panel-actions">
    <button type="button" id="new-kit">New kit</button>
    <button type="button" id="today" hidden>Today’s kit</button>
  </div>
</aside>
<main>
  <header class="mast">
    <div class="mast-left">
      <button type="button" id="panel-toggle" aria-expanded="false" aria-controls="kit-panel">Kit</button>
      <p class="kicker">Daily Earshot</p>
    </div>
    <p class="date" id="date"></p>
  </header>
  <h1 id="kit-name">Night Market</h1>
  <div class="transport">
    <button type="button" id="play" aria-pressed="false">Play</button>
    <label class="tempo">Tempo
      <input id="tempo" type="range" min="64" max="168" step="1" value="86" aria-label="Tempo">
      <b id="tempo-out">86</b>
    </label>
    <p class="readout" id="readout" aria-live="polite"></p>
    <button type="button" id="extend">Extend</button>
  </div>
  <p class="lede" id="lede"></p>
  <p class="status" id="status" role="status"></p>
  <div class="ticks" id="ticks" role="group" aria-label="Bars"></div>
  <div class="score" id="score"></div>
  <noscript><p class="note">This page needs JavaScript to play the drums.</p></noscript>
</main>
<script>
(function () {
  "use strict";

  const STEPS = 16;
  const MAX_BARS = 64;

  // --- date, hash -----------------------------------------------------------
  // The kit is chosen from the calendar date in Asia/Shanghai, so a date is
  // stable and the next date is a different kit without editing this file.

  function shanghaiNow(d) {
    const when = d || new Date();
    const iso = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(when);
    const label = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Shanghai", weekday: "long", day: "numeric", month: "long", year: "numeric"
    }).format(when).replace(/,/g, "").replace(/\s+/g, " ").trim();
    return { iso: iso, label: label };
  }

  function hashString(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function place(bar, salt, voice, step, vel, semi, nudge) {
    let n = nudge || 0;
    if (!(voice === "kick" && step === 0)) {
      const h = hashString(salt + ":" + bar + ":" + step + ":" + voice) % 5;
      n += (h - 2) * 0.0018;
    }
    return { voice: voice, step: step, vel: vel, semi: semi || 0, nudge: n };
  }

  // --- kits -----------------------------------------------------------------
  // Each family is a designed set of eight roles. Kinds are synthesis models
  // with shaped parameters (pitch fall, noise colour, partials), not samples.
  // Roles stay fixed so a pattern essence can move between kits:
  //   kick time, snare lead, hat skeleton, ghost, bell short metal,
  //   ring long metal, tom fills, clap punctuation.

  const VOICES = {
    market: [
      { id: "kick", name: "pot", kind: "kick", fEnd: 66, sweep: 1.45, snap: 0.008, drop: 0.06, decay: 0.13, click: 0.22, drive: 2.1, body: 230, bodyGain: 0.24, bodyTau: 0.04, gain: 0.78 },
      { id: "snare", name: "lantern", kind: "snare", f: 164, tone: 0.78, snappy: 0.42, noiseTau: 0.08, noiseHp: 800, noiseBp: 2200, noiseQ: 0.65, gain: 0.52 },
      { id: "hat", name: "seeds", kind: "shaker", bp: 4600, hp: 2600, q: 0.85, decay: 0.045, grains: 6, gap: 0.0045, gain: 0.36 },
      { id: "ghost", name: "rim", kind: "rim", f: 590, decay: 0.04, noise: 0.5, gain: 0.34 },
      { id: "bell", name: "brass", kind: "cowbell", f1: 690, f2: 988, center: 1480, decay: 0.09, gain: 0.42 },
      { id: "ring", name: "bowl", kind: "bowl", f: 286, decay: 0.42, gain: 0.34 },
      { id: "tom", name: "palm", kind: "kick", fEnd: 132, sweep: 0.48, snap: 0.006, drop: 0.045, decay: 0.16, click: 0.05, drive: 1.6, body: 210, bodyGain: 0.14, bodyTau: 0.05, gain: 0.5 },
      { id: "clap", name: "clapper", kind: "clap", center: 920, bursts: 3, gap: 0.0085, tail: 0.05, q: 1.3, flesh: 0.45, gain: 0.42 }
    ],
    kiln: [
      { id: "kick", name: "thud", kind: "kick", fEnd: 78, sweep: 1.2, snap: 0.005, drop: 0.035, decay: 0.14, click: 0.5, drive: 3.3, body: 340, bodyGain: 0.3, bodyTau: 0.03, gain: 0.76 },
      { id: "snare", name: "shard", kind: "snare", f: 214, tone: 0.84, snappy: 0.32, noiseTau: 0.055, noiseHp: 1400, noiseBp: 3100, noiseQ: 1.1, gain: 0.46 },
      { id: "hat", name: "grog", kind: "shaker", bp: 6400, hp: 4200, q: 1.3, decay: 0.028, grains: 4, gap: 0.0035, gain: 0.18 },
      { id: "ghost", name: "edge", kind: "rim", f: 860, decay: 0.028, noise: 0.7, gain: 0.34 },
      { id: "bell", name: "tick", kind: "cowbell", f1: 1040, f2: 1480, center: 2100, decay: 0.04, gain: 0.18 },
      { id: "ring", name: "jar", kind: "bowl", f: 410, decay: 0.22, gain: 0.18 },
      { id: "tom", name: "cup", kind: "kick", fEnd: 176, sweep: 0.32, snap: 0.004, drop: 0.03, decay: 0.11, click: 0.18, drive: 2.2, body: 420, bodyGain: 0.2, bodyTau: 0.03, gain: 0.4 },
      { id: "clap", name: "block", kind: "clap", center: 1350, bursts: 2, gap: 0.0055, tail: 0.028, q: 2.2, flesh: 0.25, gain: 0.32 }
    ],
    ferry: [
      { id: "kick", name: "hull", kind: "kick", fEnd: 44, sweep: 2.05, snap: 0.011, drop: 0.085, decay: 0.36, click: 0.16, drive: 2.6, body: 98, bodyGain: 0.16, bodyTau: 0.08, gain: 0.86 },
      { id: "snare", name: "slap", kind: "snare", f: 142, tone: 0.4, snappy: 0.9, noiseTau: 0.13, noiseHp: 1200, noiseBp: 3400, noiseQ: 0.7, gain: 0.48 },
      { id: "hat", name: "spray", kind: "metal", scale: 1.04, decay: 0.05, gain: 0.2 },
      { id: "ghost", name: "rope", kind: "rim", f: 410, decay: 0.055, noise: 0.6, gain: 0.3 },
      { id: "bell", name: "ship", kind: "cowbell", f1: 540, f2: 800, center: 1180, decay: 0.15, gain: 0.28 },
      { id: "ring", name: "buoy", kind: "bowl", f: 196, decay: 0.7, gain: 0.22 },
      { id: "tom", name: "fender", kind: "kick", fEnd: 96, sweep: 0.62, snap: 0.008, drop: 0.05, decay: 0.22, click: 0.08, drive: 1.8, body: 160, bodyGain: 0.14, bodyTau: 0.06, gain: 0.46 },
      { id: "clap", name: "canvas", kind: "clap", center: 740, bursts: 4, gap: 0.011, tail: 0.07, q: 1.2, flesh: 0.4, gain: 0.28 }
    ],
    paper: [
      { id: "kick", name: "thumb", kind: "kick", fEnd: 84, sweep: 1.05, snap: 0.004, drop: 0.028, decay: 0.11, click: 0.62, drive: 1.45, body: 190, bodyGain: 0.08, bodyTau: 0.025, gain: 0.7 },
      { id: "snare", name: "page", kind: "snare", f: 248, tone: 0.55, snappy: 0.75, noiseTau: 0.045, noiseHp: 1800, noiseBp: 4200, noiseQ: 0.9, gain: 0.4 },
      { id: "hat", name: "salt", kind: "shaker", bp: 7200, hp: 5000, q: 0.7, decay: 0.022, grains: 7, gap: 0.0028, gain: 0.16 },
      { id: "ghost", name: "nail", kind: "rim", f: 1280, decay: 0.022, noise: 0.35, gain: 0.26 },
      { id: "bell", name: "pin", kind: "cowbell", f1: 1240, f2: 1860, center: 2500, decay: 0.035, gain: 0.14 },
      { id: "ring", name: "glass", kind: "bowl", f: 523, decay: 0.28, gain: 0.14 },
      { id: "tom", name: "pad", kind: "kick", fEnd: 198, sweep: 0.28, snap: 0.003, drop: 0.025, decay: 0.09, click: 0.12, drive: 1.3, body: 360, bodyGain: 0.1, bodyTau: 0.03, gain: 0.34 },
      { id: "clap", name: "snap", kind: "clap", center: 2200, bursts: 2, gap: 0.0035, tail: 0.03, q: 2.4, flesh: 0.12, gain: 0.24 }
    ]
  };

  const FAMILIES = {
    market: { id: "market", name: "Night Market", idea: "Clay, paper, and small brass.", tempo: 86, room: 0.15 },
    kiln: { id: "kiln", name: "Kiln Door", idea: "Dry ceramic and close wood.", tempo: 102, room: 0.07 },
    ferry: { id: "ferry", name: "Night Ferry", idea: "A low hull and slow metal.", tempo: 74, room: 0.22 },
    paper: { id: "paper", name: "Paper Room", idea: "Close, dry, and short.", tempo: 118, room: 0.045 }
  };

  // --- pattern essences -----------------------------------------------------
  // A bar is 16 steps. Beats fall on 0, 4, 8, 12.
  // Variation is a function of the bar index, not a reshuffle:
  //   phase = bar % 4 → identity, displace, ghosts, fill
  //   bar % 8 === 7 → breath instead of the fill
  //   odd phrases (bars 4–7, 12–15, …) move a color voice and thin or ghost the line
  //   from the third phrase on, the fill grows longer
  // The same bars return on every loop. Extension appends the next indices.

  function lateCompose(bar, salt) {
    // Late lantern.
    // The snare is the lead: a sixteenth after beat 2 (step 5) and again after
    // beat 4 (step 13). Beats 2 and 4 themselves stay empty so the lateness
    // reads. The kick holds beat 1 and a side-step on the & of 3 (step 10).
    // The shaker leaves those pillar steps alone. Accents: the downbeat, and
    // the first late snare. Displace pushes both answers one step later.
    // Ghosts put a quiet snare back on the beat that was left empty.
    const phrase = Math.floor(bar / 4);
    const odd = phrase % 2 === 1;
    const deep = phrase >= 2;
    const late = 0.007;
    if (bar % 8 === 7) {
      return [
        place(bar, salt, "kick", 0, 0.88),
        place(bar, salt, "snare", 5, 0.72, 0, late),
        place(bar, salt, "ring", 8, 0.42),
        place(bar, salt, "bell", 15, 0.34)
      ];
    }
    const phase = bar % 4;
    if (phase === 0) {
      const hits = [
        place(bar, salt, "kick", 0, 1),
        place(bar, salt, "kick", 10, 0.6),
        place(bar, salt, "snare", 5, 0.98, 0, late),
        place(bar, salt, "snare", 13, 0.56, 0, late),
        place(bar, salt, "hat", 2, 0.36),
        place(bar, salt, "hat", 7, 0.3),
        place(bar, salt, "hat", 8, 0.4),
        place(bar, salt, "hat", 14, 0.3),
        place(bar, salt, "ghost", 3, 0.28),
        place(bar, salt, "ghost", 11, 0.26)
      ];
      if (odd) {
        hits.push(place(bar, salt, "bell", 7, 0.58));
        hits.push(place(bar, salt, "tom", 14, 0.3, -2));
      } else {
        hits.push(place(bar, salt, "bell", 15, 0.68));
      }
      return hits;
    }
    if (phase === 1) {
      const hits = [
        place(bar, salt, "kick", 0, 0.96),
        place(bar, salt, "kick", 9, 0.55),
        place(bar, salt, "snare", 6, 0.92, 0, late + 0.002),
        place(bar, salt, "snare", 14, 0.5, 0, late),
        place(bar, salt, "hat", 2, 0.28),
        place(bar, salt, "hat", 8, 0.32),
        place(bar, salt, "ghost", 3, 0.24),
        place(bar, salt, "ghost", 11, 0.24),
        place(bar, salt, "bell", 15, 0.5)
      ];
      if (odd) hits.push(place(bar, salt, "snare", 4, 0.28));
      else hits.push(place(bar, salt, "hat", 7, 0.26));
      return hits;
    }
    if (phase === 2) {
      const hits = [
        place(bar, salt, "kick", 0, 1),
        place(bar, salt, "kick", 10, 0.5),
        place(bar, salt, "snare", 4, 0.3),
        place(bar, salt, "snare", 5, 0.94, 0, late),
        place(bar, salt, "snare", 13, 0.52, 0, late),
        place(bar, salt, "hat", 2, 0.34),
        place(bar, salt, "hat", 7, 0.28),
        place(bar, salt, "hat", 8, 0.38),
        place(bar, salt, "hat", 14, 0.28),
        place(bar, salt, "hat", 1, 0.18),
        place(bar, salt, "hat", 9, 0.18),
        place(bar, salt, "ghost", 3, 0.3),
        place(bar, salt, "ghost", 11, 0.28),
        place(bar, salt, "ghost", 12, 0.24)
      ];
      if (odd) {
        hits.push(place(bar, salt, "ring", 8, 0.38));
        hits.push(place(bar, salt, "clap", 12, 0.28));
      } else {
        hits.push(place(bar, salt, "ring", 0, 0.26));
        hits.push(place(bar, salt, "clap", 14, 0.26));
      }
      return hits;
    }
    const palm = deep
      ? [[8, 0.5, 2], [10, 0.55, 0], [12, 0.48, -2], [14, 0.44, -5]]
      : [[9, 0.58, 0], [11, 0.52, -2], [14, 0.46, -4], [15, 0.4, -5]];
    const hits = [
      place(bar, salt, "kick", 0, 0.9),
      place(bar, salt, "snare", 5, 0.85, 0, late),
      place(bar, salt, "snare", 12, 0.38),
      place(bar, salt, "snare", 13, 0.96, 0, late),

  function gateCompose(bar, salt) {

      place(bar, salt, "hat", 8, 0.24),

  const ESSENCES = {

  // Sunday 22 Nov 2026, Asia/Shanghai. Hand-set: no transposition, no decay nudge.
  const AUTHORED = {
    "2026-11-22": {
      familyId: "market",
      essenceId: "late",
      name: "Night Market",
      lede: "Clay, paper, and small brass — a late lantern. The pot holds the one and steps aside; the lantern answers a sixteenth late, after beat 2 and again after beat 4, and the seeds leave those beats empty.",
      tempo: 86,
      room: 0.15,
      semi: 0,
      decayMul: 1,
      authored: true
    }
  };

  function titled(name, semi, decayMul) {
    const bits = [];
    if (semi > 0) bits.push("higher");
    if (semi < 0) bits.push("lower");
    if (decayMul > 1) bits.push("longer");
    if (decayMul < 1) bits.push("drier");
    if (!bits.length) return name;
    if (bits.length === 1) return name + ", " + bits[0];
    return name + ", " + bits[0] + " and " + bits[1];
  }

  function resolve(iso, roll) {
    if (roll === 0 && AUTHORED[iso]) {
      const a = AUTHORED[iso];
      return {
        familyId: a.familyId,
        essenceId: a.essenceId,
        name: a.name,
        lede: a.lede,
        tempo: a.tempo,
        room: a.room,
        semi: 0,
        decayMul: 1,
        authored: true,
        voices: VOICES[a.familyId].map(function (v) { return Object.assign({}, v); }),
        essence: ESSENCES[a.essenceId],
        key: a.familyId + "|" + a.essenceId + "|0|1|authored"
      };
    }
    const rng = mulberry32(hashString(iso + "#" + roll));
    const familyIds = Object.keys(FAMILIES);
    const essenceIds = Object.keys(ESSENCES);
    const family = FAMILIES[familyIds[Math.floor(rng() * familyIds.length)]];
    const essence = ESSENCES[essenceIds[Math.floor(rng() * essenceIds.length)]];
    const semi = [-2, -1, 0, 1, 2][Math.floor(rng() * 5)];
    const decayMul = [0.88, 1, 1.12][Math.floor(rng() * 3)];
    const tempoOff = [-4, 0, 4][Math.floor(rng() * 3)];
    return {
      familyId: family.id,
      essenceId: essence.id,
      name: titled(family.name, semi, decayMul),
      lede: family.idea + " " + essence.name + ": " + essence.line,
      tempo: family.tempo + tempoOff,
      room: family.room,
      semi: semi,
      decayMul: decayMul,
      authored: false,
      voices: VOICES[family.id].map(function (v) { return Object.assign({}, v); }),
      essence: essence,
      key: family.id + "|" + essence.id + "|" + semi + "|" + decayMul
    };
  }

  function barKind(bar) {
    if (bar % 8 === 7) return "breath";
    return ["identity", "displace", "ghosts", "fill"][bar % 4];
  }

  // --- synthesis ------------------------------------------------------------
  // Models follow the same ideas as a careful drum synth: a kick whose pitch
  // falls in two stages, a snare of two falling tones plus a tuned noise bed,
  // claps as a few bursts and a cavity, metal from inharmonic partials or a
  // six-oscillator cluster, a shaker as decaying grains. Parameters stay on
  // the voice so a date can transpose a whole kit without breaking it.

  const HAT_OSC = [205.3, 304.4, 369.6, 522.7, 540.0, 800.0];
  const BOWL = [
    [1, 0.55, 1],
    [2.003, 0.24, 0.7],
    [2.76, 0.18, 0.48],
    [3.02, 0.1, 0.36],
    [4.17, 0.06, 0.24],
    [5.43, 0.035, 0.16]
  ];

  let ctx = null;
  let master = null;
  let room = null;
  let analyser = null;
  let noiseBuf = null;
  const curves = new Map();

  function noiseBuffer() {
    if (noiseBuf) return noiseBuf;
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let s = 1;
    for (let i = 0; i < len; i++) {
      s = (s * 16807) % 2147483647;
      d[i] = (s / 2147483647) * 2 - 1;
    }
    noiseBuf = buf;
    return buf;
  }

  function tanhCurve(drive) {
    const n = 2048;
    const c = new Float32Array(n);
    const k = Math.max(1, drive);
    const norm = Math.tanh(k);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(k * x) / norm;
    }
    return c;
  }

  function shaper(drive) {
    const key = drive.toFixed(2);
    if (!curves.has(key)) curves.set(key, tanhCurve(drive));
    const w = ctx.createWaveShaper();
    w.curve = curves.get(key);
    w.oversample = "2x";
    return w;
  }

  function biquad(type, freq, q) {
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = Math.max(20, Math.min(freq, ctx.sampleRate * 0.45));
    f.Q.value = q;
    return f;
  }

  function env(param, time, peak, attack, hold, tau) {
    const a = Math.max(0.001, attack);
    const h = Math.max(0, hold);
    const t = Math.max(0.006, tau);
    const pk = Math.max(0.0008, peak);
    param.cancelScheduledValues(time);
    param.setValueAtTime(0.0001, time);
    param.exponentialRampToValueAtTime(pk, time + a);
    if (h > 0.001) param.setValueAtTime(pk, time + a + h);
    param.setTargetAtTime(0.0001, time + a + h, t);
    return time + a + h + t * 8;
  }

  function cleanup(nodes, when) {
    const ms = Math.max(0, (when - ctx.currentTime) * 1000 + 40);
    setTimeout(function () {
      for (let i = 0; i < nodes.length; i++) {
        try { nodes[i].disconnect(); } catch (e) { /* already gone */ }
      }
    }, ms);
  }

  function burstNoise(dest, time, hpHz, bpHz, q, tau, peak, offset, nodes) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer();
    src.loop = true;
    const hp = biquad("highpass", hpHz, 0.7);
    const bp = biquad("bandpass", bpHz, q);
    const g = ctx.createGain();
    const stop = env(g.gain, time, peak, 0.001, 0, tau);
    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    g.connect(dest);
    src.start(time, offset);
    src.stop(stop + 0.01);
    nodes.push(src, hp, bp, g);
    return stop;
  }

  function semiOf(voice, semi) {
    return (voice.semi || 0) + (kit ? kit.semi : 0) + (semi || 0);
  }

  function decayOf(voice, key) {
    const mul = (kit ? kit.decayMul : 1) * (voice.decayUser == null ? 1 : voice.decayUser);
    return (voice[key] || 0.1) * mul;
  }

  function voiceOut(node, voice, nodes) {
    const color = voice.color || 0;
    if (Math.abs(color) < 0.02) {
      node.connect(master);
      return;
    }
    const f = ctx.createBiquadFilter();
    if (color < 0) {
      f.type = "lowpass";
      f.frequency.value = 9000 * Math.pow(2, color * 2.2);
      f.Q.value = 0.7;
    } else {
      f.type = "highshelf";
      f.frequency.value = 2800;
      f.gain.value = color * 8;
    }
    node.connect(f);
    f.connect(master);
    nodes.push(f);
  }

  function triggerKick(v, time, vel, semi) {
    const s = semiOf(v, semi);
    const ratio = Math.pow(2, s / 12);
    const fEnd = Math.max(32, v.fEnd * ratio);
    const peak = v.gain * vel;
    const tau = decayOf(v, "decay");
    const nodes = [];
    const bus = ctx.createGain();
    const shape = shaper(v.drive || 1.6);
    const amp = ctx.createGain();
    const stop = env(amp.gain, time, peak, 0.002, 0.01, tau);
    const osc = ctx.createOscillator();
    osc.type = "sine";
    const top = fEnd * Math.pow(2, v.sweep);
    const mid = fEnd * Math.pow(2, v.sweep * 0.36);
    osc.frequency.setValueAtTime(Math.max(40, top), time);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, mid), time + v.snap);
    osc.frequency.exponentialRampToValueAtTime(Math.max(28, fEnd), time + v.snap + v.drop);
    osc.connect(shape);
    shape.connect(amp);
    amp.connect(bus);
    osc.start(time);
    osc.stop(stop);
    nodes.push(osc, shape, amp);

    if (v.body) {
      const body = ctx.createOscillator();
      body.type = "sine";
      const bf = Math.max(40, v.body * ratio);
      body.frequency.setValueAtTime(bf * 1.05, time);
      body.frequency.exponentialRampToValueAtTime(bf, time + 0.045);
      const bg = ctx.createGain();
      env(bg.gain, time, peak * (v.bodyGain || 0.15), 0.0015, 0, v.bodyTau || 0.04);
      body.connect(bg);
      bg.connect(bus);
      body.start(time);
      body.stop(time + 0.45);
      nodes.push(body, bg);
    }

    if (v.click) {
      const clickGain = peak * v.click * 0.55;
      burstNoise(bus, time, 2400, 5200, 0.7, 0.0022, clickGain, 0.05, nodes);
      const blip = ctx.createOscillator();
      blip.type = "sine";
      blip.frequency.value = 3400 * Math.pow(2, s / 24);
      const cg = ctx.createGain();
      env(cg.gain, time, clickGain * 0.45, 0.001, 0, 0.0016);
      blip.connect(cg);
      cg.connect(bus);
      blip.start(time);
      blip.stop(time + 0.03);
      nodes.push(blip, cg);
    }

    voiceOut(bus, v, nodes);
    nodes.push(bus);
    cleanup(nodes, stop + 0.02);
  }

  function triggerSnare(v, time, vel, semi) {
    const s = semiOf(v, semi);
    const ratio = Math.pow(2, s / 12);
    const f = Math.max(70, v.f * ratio);
    const peak = v.gain * vel;
    const nodes = [];
    const bus = ctx.createGain();
    const tone = ctx.createGain();
    tone.gain.value = v.tone;
    const pairs = [[f, 0.045, 0.55], [f * 1.78, 0.03, 0.32]];
    let stop = time + 0.2;
    for (let i = 0; i < pairs.length; i++) {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(pairs[i][0] * (1 + 0.06 * vel), time);
      osc.frequency.exponentialRampToValueAtTime(pairs[i][0], time + 0.04);
      const g = ctx.createGain();
      const end = env(g.gain, time, peak * pairs[i][2], 0.001, 0, pairs[i][1]);
      osc.connect(g);
      g.connect(tone);
      osc.start(time);
      osc.stop(end);
      nodes.push(osc, g);
      if (end > stop) stop = end;
    }
    tone.connect(bus);
    nodes.push(tone);
    const nStop = burstNoise(
      bus, time, v.noiseHp, v.noiseBp * Math.pow(2, 0.15 * vel), v.noiseQ,
      decayOf(v, "noiseTau"), peak * v.snappy * 0.85, 0.37, nodes
    );
    if (nStop > stop) stop = nStop;
    const shape = shaper(1.8 + vel);
    bus.connect(shape);
    voiceOut(shape, v, nodes);
    nodes.push(bus, shape);
    cleanup(nodes, stop + 0.02);
  }

  function triggerShaker(v, time, vel) {
    const s = semiOf(v, 0);
    const ratio = Math.pow(2, s / 12);
    const n = Math.max(3, Math.round(v.grains * (0.55 + 0.45 * vel)));
    const nodes = [];
    const bus = ctx.createGain();
    let t = time;
    let stop = time;
    for (let i = 0; i < n; i++) {
      const local = decayOf(v, "decay") * (0.45 + 0.7 * (1 - i / n));
      const peak = v.gain * vel * (1 - i / (n + 0.4));
      const end = burstNoise(bus, t, v.hp * ratio, v.bp * ratio, v.q, local, peak, 0.82, nodes);
      if (end > stop) stop = end;
      t += v.gap * (1 + i * 0.32);
    }
    voiceOut(bus, v, nodes);
    nodes.push(bus);
    cleanup(nodes, stop + 0.02);
  }

  function triggerMetal(v, time, vel) {
    const s = semiOf(v, 0);
    const scale = (v.scale || 1) * Math.pow(2, s / 12);
    const tau = decayOf(v, "decay") * (0.65 + 0.8 * vel);
    const nodes = [];
    const mix = ctx.createGain();
    mix.gain.value = 0.16;
    const end = time + tau * 8 + 0.05;
    for (let i = 0; i < HAT_OSC.length; i++) {
      const o = ctx.createOscillator();
      o.type = "square";
      o.frequency.value = HAT_OSC[i] * scale;
      o.connect(mix);
      o.start(time);
      o.stop(end);
      nodes.push(o);
    }
    const lp = biquad("lowpass", 12000, 0.7);
    const hp = biquad("highpass", 5600, 0.7);
    const bp = biquad("bandpass", 8600 * Math.pow(2, 0.12 * vel), 0.85);
    const amp = ctx.createGain();
    const stop = env(amp.gain, time, v.gain * vel, 0.001, 0, tau);
    mix.connect(lp);
    lp.connect(hp);
    hp.connect(bp);
    bp.connect(amp);
    voiceOut(amp, v, nodes);
    nodes.push(mix, lp, hp, bp, amp);
    burstNoise(amp, time, 7000, 10000, 0.6, tau * 0.5, v.gain * vel * 0.25, 1.2, nodes);
    cleanup(nodes, stop + 0.02);
  }

  function triggerRim(v, time, vel) {
    const s = semiOf(v, 0);
    const f = v.f * Math.pow(2, s / 12);
    const peak = v.gain * vel;
    const tau = decayOf(v, "decay");
    const nodes = [];
    const bus = ctx.createGain();
    const freqs = [f, f * 1.07];
    let stop = time;
    for (let i = 0; i < freqs.length; i++) {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(freqs[i] * 1.03, time);
      o.frequency.exponentialRampToValueAtTime(freqs[i], time + 0.02);
      const g = ctx.createGain();
      const end = env(g.gain, time, peak * (i === 0 ? 0.7 : 0.45), 0.001, 0, tau);
      o.connect(g);
      g.connect(bus);
      o.start(time);
      o.stop(end);
      nodes.push(o, g);
      if (end > stop) stop = end;
    }
    const nEnd = burstNoise(bus, time, f * 1.4, f * 2.6, 1.4, 0.012, peak * (v.noise || 0.4), 1.45, nodes);
    if (nEnd > stop) stop = nEnd;
    voiceOut(bus, v, nodes);
    nodes.push(bus);
    cleanup(nodes, stop + 0.02);
  }

  function triggerCowbell(v, time, vel) {
    const s = semiOf(v, 0);
    const ratio = Math.pow(2, s / 12);
    const peak = v.gain * vel;
    const tau = decayOf(v, "decay");
    const nodes = [];
    const mix = ctx.createGain();
    const bp = biquad("bandpass", v.center * ratio, 1.35);
    const amp = ctx.createGain();
    const stop = env(amp.gain, time, peak, 0.001, 0, tau);
    const fs = [v.f1 * ratio, v.f2 * ratio];
    for (let i = 0; i < fs.length; i++) {
      const o = ctx.createOscillator();
      o.type = "square";
      o.frequency.value = fs[i];
      o.detune.value = i === 0 ? -4 : 7;
      const g = ctx.createGain();
      g.gain.value = i === 0 ? 1.15 : 0.9;
      o.connect(g);
      g.connect(mix);
      o.start(time);
      o.stop(stop);
      nodes.push(o, g);
    }
    const lp = biquad("lowpass", 6500, 0.7);
    mix.connect(lp);
    lp.connect(bp);
    bp.connect(amp);
    voiceOut(amp, v, nodes);
    nodes.push(mix, lp, bp, amp);
    burstNoise(amp, time, 1800, v.center, 0.8, 0.004, peak * 0.35, 0.2, nodes);
    cleanup(nodes, stop + 0.02);
  }

  function triggerBowl(v, time, vel) {
    const s = semiOf(v, 0);
    const f0 = v.f * Math.pow(2, s / 12);
    const peak = v.gain * vel;
    const tau = decayOf(v, "decay");
    const nodes = [];
    const bus = ctx.createGain();
    let stop = time;
    for (let i = 0; i < BOWL.length; i++) {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.value = f0 * BOWL[i][0];
      const g = ctx.createGain();
      const end = env(g.gain, time, peak * BOWL[i][1], 0.002, 0, tau * BOWL[i][2]);
      o.connect(g);
      g.connect(bus);
      o.start(time);
      o.stop(end);
      nodes.push(o, g);
      if (end > stop) stop = end;
    }
    voiceOut(bus, v, nodes);
    nodes.push(bus);
    cleanup(nodes, stop + 0.02);
  }

  function triggerClap(v, time, vel) {
    const s = semiOf(v, 0);
    const centre = v.center * Math.pow(2, s / 12) * Math.pow(2, 0.12 * vel);
    const peak = v.gain * vel;
    const nodes = [];
    const bus = ctx.createGain();
    let stop = time;
    const wobble = ((hashString(v.name) % 5) - 2) * 0.00035;
    // Band-passed noise is much quieter than the envelope peak, so the bursts
    // carry a makeup gain. The flesh thud stays lower: it is the palm, not the crack.
    const makeup = 4.5;
    for (let b = 0; b < v.bursts; b++) {
      const t0 = time + b * (v.gap + wobble);
      const pk = peak * makeup * (b === v.bursts - 1 ? 1 : 0.72);
      const end = burstNoise(bus, t0, 700, centre, v.q, 0.0045, pk, 1.05, nodes);
      if (end > stop) stop = end;
    }
    const tailAt = time + (v.bursts - 1) * v.gap;
    const tail = burstNoise(bus, tailAt, 500, centre * 0.85, 0.8, decayOf(v, "tail"), peak * makeup * 0.45, 1.15, nodes);
    if (tail > stop) stop = tail;
    const flesh = burstNoise(bus, time, 180, 460, 0.7, 0.007, peak * (v.flesh || 0.3) * 2.4, 0.15, nodes);
    if (flesh > stop) stop = flesh;
    voiceOut(bus, v, nodes);
    nodes.push(bus);
    cleanup(nodes, stop + 0.02);
  }

  const TRIGGERS = {
    kick: triggerKick,
    snare: triggerSnare,
    shaker: triggerShaker,
    metal: triggerMetal,
    rim: triggerRim,
    cowbell: triggerCowbell,
    bowl: triggerBowl,
    clap: triggerClap
  };

  // Acoustic and modern are rendered one-shots, not more oscillator presets.
  const SAMPLE = {
    acoustic: {
      title: "Acoustic",
      files: {
        kick: "kits/acoustic/kick.wav",
        snare: "kits/acoustic/snare.wav",
        hat: "kits/acoustic/hat.wav",
        ghost: "kits/acoustic/rim.wav",
        bell: "kits/acoustic/clave.wav",
        ring: "kits/acoustic/ride.wav",
        tom: "kits/acoustic/tom.wav",
        clap: "kits/acoustic/clap.wav"
      },
      names: {
        kick: "kick", snare: "snare", hat: "hat", ghost: "rim",
        bell: "clave", ring: "ride", tom: "tom", clap: "clap"
      }
    },
    modern: {
      title: "Modern electronic",
      files: {
        kick: "kits/modern/kick.wav",
        snare: "kits/modern/clap.wav",
        hat: "kits/modern/hat.wav",
        ghost: "kits/modern/snare.wav",
        bell: "kits/modern/perc.wav",
        ring: "kits/modern/openhat.wav",
        tom: "kits/modern/tom.wav",
        clap: "kits/modern/clap.wav"
      },
      names: {
        kick: "kick", snare: "clap", hat: "hat", ghost: "snare",
        bell: "perc", ring: "open hat", tom: "tom", clap: "clap"
      }
    }
  };
  const SAMPLE_GAIN = {
    kick: 0.92, snare: 0.72, hat: 0.38, ghost: 0.48,
    bell: 0.42, ring: 0.36, tom: 0.68, clap: 0.7
  };
  const tweak = {};
  const buffers = { acoustic: null, modern: null };
  const loadError = { acoustic: "", modern: "" };
  let mode = "osc";

  function voiceLive(voice) {
    const t = tweak[voice.id];
    if (!t) return voice;
    const level = t.level == null ? 1 : t.level;
    const pitch = t.pitch || 0;
    const decayUser = t.decay == null ? 1 : t.decay;
    const color = t.color || 0;
    if (level === 1 && pitch === 0 && decayUser === 1 && color === 0) return voice;
    return Object.assign({}, voice, {
      gain: voice.gain * level,
      semi: (voice.semi || 0) + pitch,
      decayUser: decayUser,
      color: color
    });
  }

  function loadKit(which) {
    if (buffers[which]) return Promise.resolve(buffers[which]);
    if (loadError[which]) return Promise.reject(new Error(loadError[which]));
    const spec = SAMPLE[which];
    const urls = [];
    Object.keys(spec.files).forEach(function (id) {
      if (urls.indexOf(spec.files[id]) < 0) urls.push(spec.files[id]);
    });
    return Promise.all(urls.map(function (url) {
      return fetch(url).then(function (res) {
        if (!res.ok) throw new Error(url + " (" + res.status + ")");
        return res.arrayBuffer();
      }).then(function (raw) {
        return ctx.decodeAudioData(raw.slice(0));
      }).then(function (buf) {
        return { url: url, buf: buf };
      });
    })).then(function (pairs) {
      const byUrl = {};
      pairs.forEach(function (pair) { byUrl[pair.url] = pair.buf; });
      const byId = {};
      Object.keys(spec.files).forEach(function (id) { byId[id] = byUrl[spec.files[id]]; });
      buffers[which] = byId;
      return byId;
    }).catch(function (err) {
      loadError[which] = err && err.message ? err.message : String(err);
      throw err;
    });
  }

  function triggerSample(id, time, vel, semi) {
    const pack = buffers[mode];
    if (!pack || !pack[id]) return;
    const t = tweak[id] || {};
    const level = t.level == null ? 1 : t.level;
    const pitch = t.pitch || 0;
    const decayUser = t.decay == null ? 1 : t.decay;
    const color = t.color || 0;
    const rate = Math.pow(2, ((kit ? kit.semi : 0) + pitch + (semi || 0)) / 12);
    const src = ctx.createBufferSource();
    src.buffer = pack[id];
    src.playbackRate.setValueAtTime(rate, time);
    const g = ctx.createGain();
    const peak = (SAMPLE_GAIN[id] || 0.5) * level * vel;
    const dur = pack[id].duration / rate;
    if (decayUser < 0.98) {
      env(g.gain, time, peak, 0.001, 0, Math.max(0.02, dur * decayUser));
    } else {
      g.gain.setValueAtTime(peak, time);
    }
    src.connect(g);
    const nodes = [src, g];
    voiceOut(g, { color: color }, nodes);
    src.start(time);
    src.stop(time + dur + 0.03);
    cleanup(nodes, time + dur + 0.05);
  }

  function trigger(voice, time, vel, semi) {
    if (!ctx || time < ctx.currentTime - 0.03) return;
    vel = Math.max(0.02, Math.min(1, vel));
    if (mode !== "osc") {
      triggerSample(voice.id, time, vel, semi || 0);
      return;
    }
    const live = voiceLive(voice);
    const fn = TRIGGERS[live.kind];
    if (!fn) return;
    fn(live, time, vel, semi || 0);
  }

  function roomAmount() {
    if (mode !== "osc") return Math.min(kit.room, 0.08);
    return kit.room;
  }

  function buildGraph() {
    ctx = new AudioContext();
    master = ctx.createGain();
    master.gain.value = 0.8;
    room = ctx.createGain();
    room.gain.value = roomAmount();
    const hip = biquad("highpass", 28, 0.7);
    const clip = shaper(1.35);
    master.connect(hip);
    hip.connect(clip);
    clip.connect(ctx.destination);
    master.connect(room);
    // Two short, damped taps. A little air around the kit, not a reverb tail.
    [[0.017, -0.35], [0.029, 0.4]].forEach(function (tap) {
      const delay = ctx.createDelay(0.1);
      delay.delayTime.value = tap[0];
      const damp = biquad("lowpass", 2400, 0.7);
      const pan = ctx.createStereoPanner();
      pan.pan.value = tap[1];
      const send = ctx.createGain();
      send.gain.value = 0.65;
      room.connect(delay);
      delay.connect(damp);
      damp.connect(pan);
      pan.connect(send);
      send.connect(ctx.destination);
    });
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    clip.connect(analyser);
  }

  function ensure() {
    if (!ctx) buildGraph();
    return ctx.resume();
  }

  // --- arrangement, transport, page -----------------------------------------

  const day = shanghaiNow();
  let roll = 0;
  let kit = resolve(day.iso, 0);
  let bars = 4;
  let pattern = [];
  let tempo = kit.tempo;
  let playing = false;
  let starting = false;
  let pos = 0;
  let nextTime = 0;
  let timer = 0;
  let raf = 0;
  const cue = [];
  let paintedBar = -1;
  let paintedStep = -2;

  function salt() {
    return day.iso + "#" + roll;
  }

  function totalSteps() {
    return bars * STEPS;
  }

  function rebuild() {
    pattern = [];
    for (let b = 0; b < bars; b++) pattern.push(kit.essence.compose(b, salt()));
    paintedBar = -1;
  }

  function voiceMap() {
    const m = {};
    for (let i = 0; i < kit.voices.length; i++) m[kit.voices[i].id] = kit.voices[i];
    return m;
  }

  function fire(bar, step, when) {
    const hits = pattern[bar];
    const byId = voiceMap();
    if (!hits) return;
    for (let i = 0; i < hits.length; i++) {
      const h = hits[i];
      if (h.step !== step) continue;
      const voice = byId[h.voice];
      if (voice) trigger(voice, when + (h.nudge || 0), h.vel, h.semi || 0);
    }
  }

  function schedule() {
    if (!playing || !ctx) return;
    const stepDur = (60 / tempo) / 4;
    const late = ctx.currentTime - 0.05;
    if (nextTime < late) {
      const miss = Math.ceil((late - nextTime) / stepDur);
      pos = (pos + miss) % totalSteps();
      nextTime += miss * stepDur;
    }
    const horizon = ctx.currentTime + 0.14;
    while (nextTime < horizon) {
      const bar = Math.floor(pos / STEPS);
      const step = pos % STEPS;
      cue.push({ when: nextTime, bar: bar, step: step });
      fire(bar, step, nextTime);
      pos = (pos + 1) % totalSteps();
      nextTime += stepDur;
    }
    const cutoff = ctx.currentTime - 1;
    while (cue.length && cue[0].when < cutoff) cue.shift();
  }

  function currentCue() {
    if (!playing || !ctx) return null;
    const now = ctx.currentTime + 0.02;
    let best = null;
    for (let i = cue.length - 1; i >= 0; i--) {
      if (cue[i].when <= now) return cue[i];
      best = cue[i];
    }
    return best && best.when - now < 0.06 ? best : null;
  }

  const playBtn = document.getElementById("play");
  const tempoInput = document.getElementById("tempo");
  const tempoOut = document.getElementById("tempo-out");
  const readout = document.getElementById("readout");
  const extendBtn = document.getElementById("extend");
  const statusEl = document.getElementById("status");
  const ticks = document.getElementById("ticks");
  const score = document.getElementById("score");
  const newBtn = document.getElementById("new-kit");
  const todayBtn = document.getElementById("today");
  const kitName = document.getElementById("kit-name");
  const lede = document.getElementById("lede");
  const dateEl = document.getElementById("date");
  const panel = document.getElementById("kit-panel");
  const panelToggle = document.getElementById("panel-toggle");
  const familiesEl = document.getElementById("families");
  const voicesEl = document.getElementById("voices");

  function say(msg) {
    statusEl.textContent = msg || "";
  }

  function clearTweaks() {
    Object.keys(tweak).forEach(function (k) { delete tweak[k]; });
  }

  function knob(id, key, label, value, min, max, step) {
    const lab = document.createElement("label");
    lab.className = "knob";
    lab.appendChild(document.createTextNode(label));
    const input = document.createElement("input");
    input.type = "range";
    input.min = String(min);
    input.max = String(max);
    input.step = String(step);
    input.value = String(value);
    input.dataset.id = id;
    input.dataset.knob = key;
    input.setAttribute("aria-label", label);
    lab.appendChild(input);
    return lab;
  }

  function syncPanel() {
    const modeBtns = panel.querySelectorAll("[data-mode]");
    for (let i = 0; i < modeBtns.length; i++) {
      modeBtns[i].setAttribute("aria-pressed", modeBtns[i].dataset.mode === mode ? "true" : "false");
    }
    familiesEl.hidden = mode !== "osc";
    familiesEl.textContent = "";
    if (mode === "osc") {
      Object.keys(FAMILIES).forEach(function (id) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = FAMILIES[id].name;
        b.dataset.family = id;
        b.setAttribute("aria-pressed", kit.familyId === id ? "true" : "false");
        familiesEl.appendChild(b);
      });
    }
    const names = mode === "osc" ? null : SAMPLE[mode].names;
    voicesEl.textContent = "";
    for (let i = 0; i < kit.voices.length; i++) {
      const voice = kit.voices[i];
      const t = tweak[voice.id] || {};
      const box = document.createElement("div");
      box.className = "voice-edit";
      const h = document.createElement("h3");
      h.textContent = names ? names[voice.id] : voice.name;
      box.appendChild(h);
      box.appendChild(knob(voice.id, "level", "Level", t.level == null ? 1 : t.level, 0.2, 1.6, 0.01));
      box.appendChild(knob(voice.id, "pitch", "Pitch", t.pitch || 0, -12, 12, 1));
      box.appendChild(knob(voice.id, "decay", "Decay", t.decay == null ? 1 : t.decay, 0.5, 1.8, 0.01));
      box.appendChild(knob(voice.id, "color", "Tone", t.color || 0, -1, 1, 0.01));
      voicesEl.appendChild(box);
    }
  }

  function setPanel(open) {
    document.body.classList.toggle("panel-open", open);
    panel.hidden = !open;
    panelToggle.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function laneName(voice) {
    if (mode === "osc") return voice.name;
    return SAMPLE[mode].names[voice.id] || voice.name;
  }

  function cellGrid(hits) {
    const g = {};
    for (let i = 0; i < hits.length; i++) {
      const k = hits[i].voice + ":" + hits[i].step;
      if (g[k] === undefined || hits[i].vel > g[k]) g[k] = hits[i].vel;
    }
    return g;
  }

  function renderChrome(resetTempo) {
    const sample = mode === "osc" ? null : SAMPLE[mode];
    kitName.textContent = sample ? sample.title : kit.name;
    lede.textContent = kit.essence.name;
    dateEl.textContent = day.label;
    document.title = "Daily Earshot — " + kitName.textContent;
    if (resetTempo) {
      tempo = Math.max(64, Math.min(168, kit.tempo));
      tempoInput.value = String(tempo);
      tempoOut.textContent = String(tempo);
    }
    todayBtn.hidden = mode === "osc" && roll === 0 && kit.authored;
    extendBtn.disabled = bars >= MAX_BARS;
    syncPanel();
  }

  function renderScore() {
    const beats = ["1", "", "", "", "2", "", "", "", "3", "", "", "", "4", "", "", ""];
    const ruler = document.createElement("div");
    ruler.className = "ruler";
    ruler.appendChild(document.createElement("span"));
    for (let s = 0; s < STEPS; s++) {
      const span = document.createElement("span");
      span.textContent = beats[s];
      ruler.appendChild(span);
    }
    score.textContent = "";
    score.appendChild(ruler);
    for (let i = 0; i < kit.voices.length; i++) {
      const voice = kit.voices[i];
      const lane = document.createElement("div");
      lane.className = "lane";
      lane.dataset.voice = voice.id;
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = laneName(voice);
      lane.appendChild(name);
      for (let s = 0; s < STEPS; s++) {
        const cell = document.createElement("div");
        cell.className = "cell" + (s % 4 === 0 ? " beat" : "");
        cell.dataset.step = String(s);
        lane.appendChild(cell);
      }
      score.appendChild(lane);
    }
    paintedBar = -1;
    paintedStep = -2;
  }

  function renderTicks(nowBar) {
    ticks.textContent = "";
    for (let b = 0; b < bars; b++) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "tick" + (b === nowBar ? " now" : "");
      el.dataset.bar = String(b);
      el.setAttribute("aria-label", "Bar " + (b + 1));
      ticks.appendChild(el);
    }
  }

  function jumpTo(bar, step) {
    if (bar < 0 || bar >= bars || step < 0 || step >= STEPS) return;
    const target = bar * STEPS + step;
    if (playing && ctx) {
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), now);
      master.gain.linearRampToValueAtTime(0.0001, now + 0.02);
      master.gain.setValueAtTime(0.8, now + 0.05);
      cue.length = 0;
      pos = target;
      nextTime = now + 0.06;
      paintedBar = -1;
      paint(bar, step);
      return;
    }
    if (starting) return;
    starting = true;
    readyAudio().then(function () {
      starting = false;
      if (playing) {
        jumpTo(bar, step);
        return;
      }
      begin(target);
    }).catch(function () {
      starting = false;
      say("The browser held the sound back. Press Play again.");
    });
  }

  function paint(bar, step) {
    if (bar !== paintedBar) {
      paintedBar = bar;
      const grid = cellGrid(pattern[bar] || []);
      const lanes = score.querySelectorAll(".lane");
      for (let i = 0; i < lanes.length; i++) {
        const id = lanes[i].dataset.voice;
        const cells = lanes[i].querySelectorAll(".cell");
        for (let s = 0; s < cells.length; s++) {
          const vel = grid[id + ":" + s];
          const on = vel !== undefined;
          cells[s].classList.toggle("on", on);
          cells[s].style.opacity = on ? String(0.28 + vel * 0.72) : "";
        }
      }
      const kind = barKind(bar);
      readout.innerHTML = "<strong>Bar " + (bar + 1) + " of " + bars + "</strong> · " + kit.essence.caption[kind];
      renderTicks(bar);
    }
    if (step !== paintedStep) {
      paintedStep = step;
      const lanes = score.querySelectorAll(".lane");
      for (let i = 0; i < lanes.length; i++) {
        const cells = lanes[i].querySelectorAll(".cell");
        let hot = false;
        for (let s = 0; s < cells.length; s++) {
          const head = s === step;
          cells[s].classList.toggle("head", head);
          if (head && cells[s].classList.contains("on")) hot = true;
        }
        lanes[i].querySelector(".name").classList.toggle("hot", hot);
      }
    }
  }

  function showStopped() {
    paint(0, -1);
  }

  function draw() {
    if (!playing) return;
    const c = currentCue();
    if (c) paint(c.bar, c.step);
    raf = requestAnimationFrame(draw);
  }

  function begin(at) {
    playing = true;
    playBtn.textContent = "Stop";
    playBtn.setAttribute("aria-pressed", "true");
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(0.8, now);
    room.gain.value = roomAmount();
    pos = typeof at === "number" ? at : 0;
    cue.length = 0;
    nextTime = now + 0.06;
    paintedBar = -1;
    paint(Math.floor(pos / STEPS), pos % STEPS);
    schedule();
    timer = setInterval(schedule, 25);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  }

  function stop() {
    playing = false;
    clearInterval(timer);
    cancelAnimationFrame(raf);
    playBtn.textContent = "Play";
    playBtn.setAttribute("aria-pressed", "false");
    if (ctx && master) {
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(0.0001, now + 0.04);
    }
    cue.length = 0;
    pos = 0;
    showStopped();
  }

  function readyAudio() {
    const resumed = ensure();
    if (mode === "osc") return resumed.then(function () { say(""); });
    return resumed.then(function () {
      return loadKit(mode).then(function () { say(""); }, function (err) {
        say(err.message || String(err));
      });
    });
  }

  function onPlay() {
    if (playing) {
      stop();
      return;
    }
    if (starting) return;
    starting = true;
    readyAudio().then(function () {
      starting = false;
      if (playing) return;
      begin();
    }).catch(function () {
      starting = false;
      say("The browser held the sound back. Press Play again.");
    });
  }

  function extend() {
    if (bars >= MAX_BARS) return;
    const from = bars;
    bars = Math.min(MAX_BARS, bars + 4);
    for (let b = from; b < bars; b++) pattern.push(kit.essence.compose(b, salt()));
    extendBtn.disabled = bars >= MAX_BARS;
    paintedBar = -1;
    const c = currentCue();
    paint(c ? c.bar : 0, c ? c.step : (playing ? paintedStep : -1));
  }

  function apply(next) {
    kit = next;
    bars = 4;
    rebuild();
    renderChrome();
    renderScore();
    if (playing && ctx) {
      const now = ctx.currentTime;
      pos = 0;
      cue.length = 0;
      nextTime = now + 0.08;
      room.gain.setTargetAtTime(roomAmount(), now, 0.03);
      paintedBar = -1;
    } else {
      showStopped();
    }
  }

  function rollKit(nextRoll) {
    let n = nextRoll;
    let next = resolve(day.iso, n);
    let guard = 0;
    while (next.key === kit.key && guard < 8) {
      n += 1;
      next = resolve(day.iso, n);
      guard += 1;
    }
    roll = n;
    mode = "osc";
    clearTweaks();
    apply(next);
  }

  function pickFamily(familyId) {
    mode = "osc";
    const family = FAMILIES[familyId];
    const essence = kit.essence;
    clearTweaks();
    if (familyId === "market" && essence.id === "late" && roll === 0 && AUTHORED[day.iso] && AUTHORED[day.iso].familyId === "market") {
      apply(resolve(day.iso, 0));
      return;
    }
    apply({
      familyId: familyId,
      essenceId: essence.id,
      name: family.name,
      lede: family.idea,
      tempo: family.tempo,
      room: family.room,
      semi: 0,
      decayMul: 1,
      authored: false,
      voices: VOICES[familyId].map(function (v) { return Object.assign({}, v); }),
      essence: essence,
      key: familyId + "|" + essence.id + "|picked"
    });
  }

  function setMode(next) {
    if (next === mode) return;
    mode = next;
    if (ctx && room) room.gain.value = roomAmount();
    renderChrome(false);
    renderScore();
    if (playing) {
      const c = currentCue();
      paint(c ? c.bar : 0, c ? c.step : -1);
    } else {
      showStopped();
    }
    if (mode === "osc") {
      say("");
      return;
    }
    const resumed = ensure();
    resumed.then(function () { return loadKit(mode); }).then(function () { say(""); }).catch(function (err) {
      say(err.message || String(err));
    });
  }

  playBtn.addEventListener("click", onPlay);
  extendBtn.addEventListener("click", extend);
  ticks.addEventListener("click", function (event) {
    const mark = event.target.closest(".tick");
    if (!mark || !ticks.contains(mark)) return;
    jumpTo(Number(mark.dataset.bar), 0);
  });
  score.addEventListener("click", function (event) {
    const cell = event.target.closest(".cell");
    if (!cell || !score.contains(cell)) return;
    const bar = paintedBar < 0 ? 0 : paintedBar;
    jumpTo(bar, Number(cell.dataset.step));
  });
  newBtn.addEventListener("click", function () { rollKit(roll + 1); });
  todayBtn.addEventListener("click", function () {
    roll = 0;
    mode = "osc";
    clearTweaks();
    apply(resolve(day.iso, 0));
  });
  panelToggle.addEventListener("click", function () { setPanel(true); });
  document.getElementById("panel-close").addEventListener("click", function () { setPanel(false); });
  panel.querySelector(".modes").addEventListener("click", function (event) {
    const b = event.target.closest("[data-mode]");
    if (!b || !panel.contains(b)) return;
    setMode(b.dataset.mode);
  });
  familiesEl.addEventListener("click", function (event) {
    const b = event.target.closest("button");
    if (!b || !familiesEl.contains(b)) return;
    pickFamily(b.dataset.family);
  });
  voicesEl.addEventListener("input", function (event) {
    const el = event.target;
    if (!el || el.tagName !== "INPUT") return;
    const id = el.dataset.id;
    if (!tweak[id]) tweak[id] = {};
    tweak[id][el.dataset.knob] = Number(el.value);
  });
  tempoInput.addEventListener("input", function () {
    tempo = Number(tempoInput.value);
    tempoOut.textContent = String(tempo);
  });
  document.addEventListener("keydown", function (event) {
    if (event.code !== "Space") return;
    if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "BUTTON")) return;
    event.preventDefault();
    onPlay();
  });

  rebuild();
  renderChrome(true);
  renderScore();
  showStopped();
})();
</script>
</body>
</html>
